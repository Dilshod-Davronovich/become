    <style>
        @font-face {
            font-family: becomi;
            src: url(becomi.ttf);
        }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #FF5733, #33FF57, #3357FF, #FF33A1);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            color: white;
            font-family: Arial, sans-serif;
        }
        .header {
            position: absolute;
            top: 20px;
            font-size: 40px;
            font-weight: bold;
            animation: rotateHorizontal 5s linear infinite;
            font-family: becomi;
        }
        @keyframes rotateHorizontal {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        .clock {
            font-size: 150px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-top: 50px;
            font-size: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .form-container label {
            margin-right: 10px;
        }
        input {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        .spacer {
            margin: 0 30px; /* Bu yerda bo'shliq qo'shildi */
        }

        /* Footer uchun stil */
        .yozuv {
            position: absolute;
            bottom: 20px;  /* Footerni pastroq qildik */
            font-size: 20px;
            font-weight: bold;
            color: rgb(255, 255, 255); /* Kumush rang */
            text-align: center;
            width: 100%;
            letter-spacing: 3px;
        }
        a {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Media Queries uchun stil */
        @media (max-width: 768px) {
            .header {
                font-size: 30px;
                top: 10px;
            }

            .clock {
                font-size: 100px;
            }

            .form-container {
                flex-direction: column;
                font-size: 16px;
                margin-top: 20px;
            }

            .yozuv {
                font-size: 18px;
                bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            .header {
                font-size: 25px;
            }

            .clock {
                font-size: 80px;
            }

            .form-container input {
                width: 80%;
            }

            .yozuv {
                font-size: 16px;
                bottom: 10px;
            }
        }

        @media (min-width: 1200px) {
            .header {
                font-size: 50px;
            }

            .clock {
                font-size: 180px;
            }

            .form-container {
                font-size: 20px;
            }

            .yozuv {
                font-size: 22px;
            }
        }
        
        /* Kattalashtirish tugmasi */
        #zoomButton {
            position: fixed;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            color: white;
            font-size: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 999;
            transition: all 0.4s ease;
        }

        #zoomButton:hover {
            background: linear-gradient(45deg, #ff9a8b, #ff6a88);
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        #zoomButton:active {
            transform: scale(1.05);
            background: linear-gradient(45deg, #ff6a88, #ff9a8b);
        }

        /* Fullscreen chiqish tugmasi */
        #exitFullscreenButton {
            position: fixed;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            color: white;
            font-size: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 999;
            display: none;
            transition: all 0.4s ease;
        }

        #exitFullscreenButton:hover {
            background: linear-gradient(45deg, #ff9a8b, #ff6a88);
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        #exitFullscreenButton:active {
            transform: scale(1.05);
            background: linear-gradient(45deg, #ff6a88, #ff9a8b);
        }
    </style>
</head>
<body>
    <div class="header">BECOMI.UZ</div>
    <div class="clock" id="clock">00:00:00</div>

    <div class="form-container">
        <label for="start-time">CHSB boshlanish vaqti:</label>
        <input type="time" id="start-time">
        
        <div class="spacer"></div> <!-- O'rtada bo'shliq joyi -->
        
        <label for="end-time">CHSB tugash vaqti:</label>
        <input type="time" id="end-time">
    </div>

    <!-- Footer qo'shish -->
    <div class="yozuv">Developed by <a href="https://t.me/bexruzbek1030" target="_blank">Bexruzbek Qodirov</a></div>

    <!-- Kattalashtirish tugmasi -->
    <button id="zoomButton">Kattalashtirish</button>

    <!-- Fullscreen chiqish tugmasi -->
    <button id="exitFullscreenButton">Qaytarish</button>

    <script>
        function updateClock() {
            const options = {
                timeZone: 'Asia/Tashkent',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            };
            const now = new Intl.DateTimeFormat('uz-UZ', options).format(new Date());
            document.getElementById('clock').textContent = now;
        }

        setInterval(updateClock, 1000);
        updateClock(); // Darhol chaqirish, 1 soniya kutmaslik uchun

        // Kattalashtirish funksiyasi
        const zoomButton = document.getElementById('zoomButton');
        const exitFullscreenButton = document.getElementById('exitFullscreenButton');
        let isZoomed = false;

        zoomButton.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // Fullscreen rejimiga o'tish
                document.documentElement.requestFullscreen();
                zoomButton.textContent = 'Qaytarish';
                exitFullscreenButton.style.display = 'block'; // Exit fullscreen tugmasini ko'rsatish
                isZoomed = true;
            }
        });

        // Exit fullscreen tugmasi
        exitFullscreenButton.addEventListener('click', () => {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                zoomButton.textContent = 'Kattalashtirish';
                exitFullscreenButton.style.display = 'none'; // Exit fullscreen tugmasini yashirish
                isZoomed = false;
            }
        });

        // Fullscreen holatini tekshirish
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                zoomButton.textContent = 'Kattalashtirish';
                exitFullscreenButton.style.display = 'none'; // Exit fullscreen tugmasini yashirish
            }
        });
    </script>
</body>
</html>
